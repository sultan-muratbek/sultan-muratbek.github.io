# Site settings. This file is not reloaded by `jekyll serve`; restart after editing.

locale: "en-US"
title: "Sultan Muratbek"
description: "Database systems research at UC Berkeley"
url: https://sultan-muratbek.github.io
baseurl: ""
repository: "sultan-muratbek/sultan-muratbek.github.io"
lang: en_US

author:
  name: "Sultan Muratbek"
  email: "sultan.muratbek@berkeley.edu"
  github: "sultan-muratbek"
  linkedin: "sultancal"
  googlescholar: "https://scholar.google.com/citations?user=0mvWXcwAAAAJ"

# jekyll-seo-tag
social:
  name: "Sultan Muratbek"
  links:
    - "https://github.com/sultan-muratbek"
    - "https://www.linkedin.com/in/sultancal"
logo: /images/sultan-muratbek.jpg

collections:
  teaching:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: academic
  - scope:
      path: ""
      type: teaching
    values:
      layout: academic

include:
  - _pages

exclude:
  - .github
  - .devcontainer
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - vendor

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

timezone: America/Los_Angeles

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag
